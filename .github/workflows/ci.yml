name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: vitest
        run: pnpm test
      # Perf smoke (brain #23d): editor interaction cost on synthetic
      # stress maps. Asserts machine-independent DOM-operation counts
      # (not wall-clock), so it's stable on shared runners; the step
      # log prints the full report. See src/editor/perf/.
      - name: perf smoke
        run: pnpm perf
      - name: vite build (produces pkg/flowgo/dist/index.html, committed alongside source)
        run: pnpm build
      # brain#273: this step used to be `git diff --exit-code --
      # dist/index.html` — a path that has not existed since the bundle
      # moved under pkg/flowgo/. An unmatched pathspec is an empty diff,
      # so it exited 0 forever and gated nothing. The script compares
      # the real path and refuses to pass if the artifact is missing or
      # untracked, so a future move fails loudly instead of silently.
      - name: pkg/flowgo/dist/index.html is up to date with source
        run: ./scripts/check-dist-fresh.sh

  validate:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: vite build (Go embeds dist/index.html)
        run: pnpm build
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test (parses + validates map.flowgo)
        run: go test ./...
