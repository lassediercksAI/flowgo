name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Cap the release scan well inside the v-prefixed era.
          # Default (400) walks back into the pre-2026-05-01 releases
          # tagged without the `v` prefix; one of those has a null
          # GraphQL tag node and crashes with
          #   Cannot read properties of null (reading 'tagCommit')
          # Manifest mode only needs to see the latest release, so 5
          # is more than enough headroom.
          release-search-depth: 5

  # Tell flowgo-website a new flowgo exists. The website's canonical
  # home is a private forge (the GitHub copy is archived); its
  # flowgo-bump workflow opens an auto-merging PR bumping
  # .flowgo-version + go.mod, which rolls through its release
  # automation into a fresh website image — no human in the loop. The
  # website also polls daily as a fallback, so a failed dispatch only
  # delays the bump, never loses it.
  #
  # Needs two secrets (both deliberately secret — the forge is not
  # public infrastructure):
  #   FORGEJO_DISPATCH_URL    full workflow-dispatch endpoint for the
  #                           website's flowgo-bump workflow
  #   FORGEJO_DISPATCH_TOKEN  PAT allowed to dispatch it
  notify-website:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the website's flowgo-bump workflow
        env:
          FORGEJO_URL: ${{ secrets.FORGEJO_DISPATCH_URL }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_DISPATCH_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "${FORGEJO_URL}" ] || [ -z "${FORGEJO_TOKEN}" ]; then
            echo "::error::FORGEJO_DISPATCH_URL / FORGEJO_DISPATCH_TOKEN unset on this repo. Not urgent: the website's daily cron fallback still picks up this release."
            exit 1
          fi
          if ! curl -fsS -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"ref\":\"main\",\"inputs\":{\"version\":\"${TAG}\"}}" \
            "${FORGEJO_URL}"; then
            echo "::error::workflow dispatch to the website forge failed. Check the FORGEJO_DISPATCH_URL / FORGEJO_DISPATCH_TOKEN secrets on THIS repo. Not urgent: the website's daily cron fallback still picks up this release."
            exit 1
          fi

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Frontend build (produces dist/index.html for go:embed)
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="flowgo-${TAG}-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "$out" ./cmd/flowgo
          echo "OUT=$out" >> "$GITHUB_ENV"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" "$OUT" --clobber
