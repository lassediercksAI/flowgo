name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Cap the release scan well inside the v-prefixed era.
          # Default (400) walks back into the pre-2026-05-01 releases
          # tagged without the `v` prefix; one of those has a null
          # GraphQL tag node and crashes with
          #   Cannot read properties of null (reading 'tagCommit')
          # Manifest mode only needs to see the latest release, so 5
          # is more than enough headroom.
          release-search-depth: 5

  # Tell flowgo-website a new flowgo exists. Its flowgo-bump workflow
  # (repository_dispatch "flowgo-release") opens an auto-merging PR
  # bumping .flowgo-version + go.mod, which rolls through its release
  # automation into a fresh website image — no human in the loop. The
  # website also polls daily as a fallback, so a failed dispatch only
  # delays the bump, never loses it.
  #
  # Needs a PAT that can write to ExaptationGmbH/flowgo-website:
  # WEBSITE_DISPATCH_TOKEN, falling back to the RELEASE_PLEASE PAT.
  notify-website:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch flowgo-release to flowgo-website
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN || secrets.RELEASE_PLEASE }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if ! gh api repos/ExaptationGmbH/flowgo-website/dispatches \
            -f event_type=flowgo-release \
            -f "client_payload[version]=${TAG}"; then
            echo "::error::repository_dispatch to ExaptationGmbH/flowgo-website failed. A 404 means the token cannot see the private repo — set the WEBSITE_DISPATCH_TOKEN secret on THIS repo to a PAT with access to ExaptationGmbH/flowgo-website (fine-grained: Contents read+write; or classic: repo scope). Not urgent: the website's daily cron fallback still picks up this release."
            exit 1
          fi

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Frontend build (produces dist/index.html for go:embed)
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="flowgo-${TAG}-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${TAG}" -o "$out" ./cmd/flowgo
          echo "OUT=$out" >> "$GITHUB_ENV"
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" "$OUT" --clobber
